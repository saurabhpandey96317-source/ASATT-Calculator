
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASATT Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080817;
  font-family: Arial;
  color: white;
  padding: 15px;
}

.calculator {
  width: 100%;
  max-width: 340px;
  padding: 20px;
  border-radius: 22px;
  background: #17172b;
  box-shadow: 0 0 25px #00eaff;
}

h1 {
  text-align: center;
  color: #00eaff;
}

#display {
  width: 100%;
  height: 75px;
  background: #080817;
  color: #00ffcc;
  border: 2px solid #00eaff;
  border-radius: 12px;
  text-align: right;
  font-size: 30px;
  padding: 12px;
  margin-bottom: 15px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  padding: 17px 5px;
  border: none;
  border-radius: 12px;
  background: #292947;
  color: white;
  font-size: 21px;
  font-weight: bold;
}

button:active {
  transform: scale(0.9);
}

.operator {
  background: #006b91;
}

.clear {
  background: #e53935;
}

.equal {
  background: #00c853;
  grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">
  <h1>🔥 ASATT</h1>
  <input id="display" value="0" readonly>

  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="backspace()">⌫</button>
    <button class="operator" onclick="choose('/')">÷</button>
    <button class="operator" onclick="choose('*')">×</button>

    <button onclick="number('7')">7</button>
    <button onclick="number('8')">8</button>
    <button onclick="number('9')">9</button>
    <button class="operator" onclick="choose('-')">−</button>

    <button onclick="number('4')">4</button>
    <button onclick="number('5')">5</button>
    <button onclick="number('6')">6</button>
    <button class="operator" onclick="choose('+')">+</button>

    <button onclick="number('1')">1</button>
    <button onclick="number('2')">2</button>
    <button onclick="number('3')">3</button>
    <button onclick="number('0')">0</button>

    <button onclick="decimal()">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
let display = document.getElementById("display");
let first = null;
let operator = null;
let fresh = true;

function number(n) {
  if (fresh || display.value === "0") {
    display.value = n;
    fresh = false;
  } else {
    display.value += n;
  }
}

function decimal() {
  if (fresh) {
    display.value = "0.";
    fresh = false;
  } else if (!display.value.includes(".")) {
    display.value += ".";
  }
}

function choose(op) {
  first = Number(display.value);
  operator = op;
  fresh = true;
}

function calculate() {
  if (first === null || operator === null || fresh) return;

  let second = Number(display.value);
  let answer;

  if (operator === "+") answer = first + second;
  if (operator === "-") answer = first - second;
  if (operator === "*") answer = first * second;
  if (operator === "/") {
    if (second === 0) {
      display.value = "Error";
      first = null;
      operator = null;
      fresh = true;
      return;
    }
    answer = first / second;
  }

  display.value = String(
    Number(answer.toFixed(8))
  );

  first = null;
  operator = null;
  fresh = true;
}

function clearAll() {
  display.value = "0";
  first = null;
  operator = null;
  fresh = true;
}

function backspace() {
  if (fresh) return;
  display.value = display.value.slice(0, -1) || "0";
}
</script>

</body>
</html>
