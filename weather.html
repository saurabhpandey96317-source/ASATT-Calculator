
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASATT Weather App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #071b45, #087ca7);
}

.app {
  width: 100%;
  max-width: 360px;
  padding: 25px;
  text-align: center;
  border-radius: 25px;
  background: rgba(255,255,255,0.13);
  box-shadow: 0 10px 35px #00152b;
  border: 1px solid rgba(255,255,255,0.2);
}

h1 {
  color: #70eaff;
}

input {
  width: 100%;
  padding: 13px;
  border: none;
  outline: none;
  border-radius: 10px;
  font-size: 16px;
  margin: 12px 0;
}

button {
  padding: 13px 25px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #00d5ff;
  color: #06223b;
  font-size: 17px;
  font-weight: bold;
}

#weather {
  margin-top: 22px;
  animation: appear 0.5s ease;
}

#icon {
  font-size: 65px;
}

#temp {
  font-size: 48px;
  font-weight: bold;
  margin: 8px;
}

#message {
  color: #ffe88a;
  font-size: 13px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="app">
  <h1>🌤️ ASATT</h1>
  <h2>Weather App</h2>

  <input
    id="city"
    type="text"
    placeholder="Enter city e.g. Patna">

  <button onclick="showWeather()">
    Check Weather 🔍
  </button>

  <div id="weather">
    <div id="icon">🌍</div>
    <h2 id="cityName">Search Your City</h2>
    <div id="temp">--°C</div>
    <p id="condition">Weather will appear here</p>
  </div>

  <p id="message">
    Demo Weather App - Sample Data
  </p>
</div>

<script>
function showWeather() {
  let city = document.getElementById("city")
    .value.trim();

  if (city === "") {
    alert("Please enter a city name!");
    return;
  }

  let weatherData = {
    "patna": [30, "☀️", "Sunny"],
    "delhi": [28, "🌤️", "Partly Cloudy"],
    "mumbai": [29, "🌧️", "Rainy"],
    "kolkata": [27, "⛅", "Cloudy"],
    "jaipur": [32, "☀️", "Sunny"],
    "lucknow": [26, "🌥️", "Cloudy"]
  };

  let data = weatherData[city.toLowerCase()];

  if (!data) {
    document.getElementById("cityName")
      .innerText = "City Not Found";

    document.getElementById("icon")
      .innerText = "❓";

    document.getElementById("temp")
      .innerText = "--°C";

    document.getElementById("condition")
      .innerText = "Try Patna, Delhi or Mumbai";

    return;
  }

  document.getElementById("cityName")
    .innerText = city;

  document.getElementById("temp")
    .innerText = data[0] + "°C";

  document.getElementById("icon")
    .innerText = data[1];

  document.getElementById("condition")
    .innerText = data[2];

  document.getElementById("message")
    .innerText = "Demo Weather Data";
}
</script>

</body>
</html>
